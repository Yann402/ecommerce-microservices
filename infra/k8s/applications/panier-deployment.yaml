# Service Panier : Deployment + Service (ClusterIP). Pas d'initContainer
# (Redis n'a pas de schéma à appliquer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panier
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panier
  template:
    metadata:
      labels:
        app: panier
    spec:
      containers:
        - name: panier
          image: panier-service:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: panier-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: panier
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observabilite.svc.cluster.local:4318
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: panier
  namespace: applications
  labels:
    app: panier
spec:
  selector:
    app: panier
  ports:
    - name: http
      port: 3003
      targetPort: 3003

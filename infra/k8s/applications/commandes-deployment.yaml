# Service Commandes : Deployment + Service (ClusterIP).
# DEUX initContainers, dans l'ordre :
#  1) create-db : crée la base `commandes` si absente (idempotent). Database per
#     Service -> base distincte de `iam` sur le même serveur PostgreSQL.
#  2) prisma-db-push : applique le schéma Prisma (tables orders/order_lines).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commandes
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commandes
  template:
    metadata:
      labels:
        app: commandes
    spec:
      initContainers:
        - name: create-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.infra-middlewares.svc.cluster.local -U ecom; do
                echo "PostgreSQL pas prêt, attente..."; sleep 2;
              done
              psql -h postgres.infra-middlewares.svc.cluster.local -U ecom -d iam -tc \
                "SELECT 1 FROM pg_database WHERE datname='commandes'" | grep -q 1 \
                || psql -h postgres.infra-middlewares.svc.cluster.local -U ecom -d iam \
                     -c "CREATE DATABASE commandes"
          env:
            - name: PGUSER
              value: ecom
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: commandes-db
                  key: PGPASSWORD
        - name: prisma-db-push
          image: commandes-service:v4
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "db", "push", "--skip-generate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commandes-db
                  key: DATABASE_URL
      containers:
        - name: commandes
          image: commandes-service:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: commandes-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commandes-db
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: commandes
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observabilite.svc.cluster.local:4318
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: commandes
  namespace: applications
  labels:
    app: commandes
spec:
  selector:
    app: commandes
  ports:
    - name: http
      port: 3004
      targetPort: 3004

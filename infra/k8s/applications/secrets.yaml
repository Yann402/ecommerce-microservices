# Données SENSIBLES. En production -> AWS Secrets Manager (ADR-21), jamais en
# clair. Ici, dev local.

# Secret JWT PARTAGÉ par tous les services (IAM, Catalogue, Panier, Commandes).
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: applications
type: Opaque
stringData:
  JWT_SECRET: "dev_secret_a_remplacer_en_production"
---
# Connexion PostgreSQL d'IAM (base iam).
apiVersion: v1
kind: Secret
metadata:
  name: iam-db
  namespace: applications
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ecom:ecom_dev_password@postgres.infra-middlewares.svc.cluster.local:5432/iam?schema=public"
---
# URL RabbitMQ PARTAGÉE (contient le mot de passe) : Catalogue, Panier, Commandes.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-url
  namespace: applications
type: Opaque
stringData:
  RABBITMQ_URL: "amqp://ecom:ecom_dev_password@rabbitmq.infra-middlewares.svc.cluster.local:5672"
---
# Connexion PostgreSQL de Commandes (base commandes, distincte de iam :
# Database per Service). PGPASSWORD sert à l'initContainer qui crée la base.
apiVersion: v1
kind: Secret
metadata:
  name: commandes-db
  namespace: applications
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ecom:ecom_dev_password@postgres.infra-middlewares.svc.cluster.local:5432/commandes?schema=public"
  PGPASSWORD: "ecom_dev_password"

# Données SENSIBLES. En production, elles proviendraient d'AWS Secrets Manager
# (ADR-21) et ne seraient jamais committées en clair — ici, dev local.

# Secret JWT PARTAGÉ par IAM et Catalogue : un seul endroit à modifier, ce qui
# garantit qu'ils signent/vérifient avec le même secret. C'est la version
# Kubernetes du « les deux doivent correspondre » qu'on avait en docker-compose.
# (Kong, dans le namespace gateway, aura besoin de la même valeur — tranche 4.)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: applications
type: Opaque
stringData:
  JWT_SECRET: "dev_secret_a_remplacer_en_production"
---
# Connexion PostgreSQL d'IAM : contient les identifiants -> Secret obligatoire.
# L'hôte est le Service du cluster, sur le port 5432 (pas 5433).
apiVersion: v1
kind: Secret
metadata:
  name: iam-db
  namespace: applications
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ecom:ecom_dev_password@postgres.infra-middlewares.svc.cluster.local:5432/iam?schema=public"

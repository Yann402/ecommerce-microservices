# Routes Panier : TOUTES protégées par JWT (aucune route publique).
# Pas de séparation par méthode : gérer son panier exige toujours un jeton.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panier-protected
  namespace: applications
  annotations:
    konghq.com/plugins: jwt,rate-limiting
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/v1/cart
            pathType: Prefix
            backend:
              service:
                name: panier
                port:
                  number: 3003

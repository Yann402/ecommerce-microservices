# Service Catalogue : Deployment + Service (ClusterIP).
# MISE À JOUR Saga : image v3 (contient le consumer RabbitMQ) + RABBITMQ_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      containers:
        - name: catalogue
          image: catalogue-service:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: catalogue-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: catalogue
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.observabilite.svc.cluster.local:4318
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: applications
  labels:
    app: catalogue
spec:
  selector:
    app: catalogue
  ports:
    - name: http
      port: 3002
      targetPort: 3002

# MongoDB — persistance du service Catalogue (StatefulSet in-cluster,
# cible identique en local et sur EKS).

# Service "headless" (clusterIP: None) : requis par un StatefulSet. Il donne
# une identité DNS stable à chaque pod (mongodb-0.mongodb.infra-middlewares...).
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: infra-middlewares
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: infra-middlewares
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
  # volumeClaimTemplates : chaque réplica reçoit son propre volume persistant
  # (PVC créé automatiquement). Les données survivent au redémarrage du pod.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
